[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "shockpath"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["Flask>=3.1,<3.2", "pydantic>=2.11,<3", "waitress>=3,<4", "numpy>=1.26,<3"]

[project.optional-dependencies]
solver = ["scipy>=1.15,<2", "matplotlib>=3.9,<4", "PyYAML>=6,<7"]
test = ["pytest>=8,<10", "jsonschema>=4.23,<5", "openapi-spec-validator>=0.7,<0.9"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
